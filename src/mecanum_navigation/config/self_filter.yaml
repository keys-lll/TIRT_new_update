# Chassis return masks in base_link (metres).
# 2026-11-02: X bounds shifted +0.07 m after correcting lidar X from 0.05 to 0.12 m.
# Measured from live scan on 2026-10-30; retune after changing sensor/body mounting.
# Points inside each box become NaN (unknown), not free-space readings.
scan_to_scan_filter_chain:
  ros__parameters:
    use_sim_time: false
    filter1:
      name: rear_left_body
      type: laser_filters/LaserScanBoxFilter
      params:
        box_frame: base_link
        min_x: -0.17
        max_x: -0.08
        min_y: 0.1
        max_y: 0.2
        min_z: -0.05
        max_z: 0.4
        invert: false
    filter2:
      name: rear_right_body
      type: laser_filters/LaserScanBoxFilter
      params:
        box_frame: base_link
        min_x: -0.17
        max_x: -0.08
        min_y: -0.2
        max_y: -0.1
        min_z: -0.05
        max_z: 0.4
        invert: false
    filter3:
      name: front_left_body
      type: laser_filters/LaserScanBoxFilter
      params:
        box_frame: base_link
        min_x: 0.055
        max_x: 0.17
        min_y: 0.1
        max_y: 0.2
        min_z: -0.05
        max_z: 0.4
        invert: false
    filter4:
      name: front_right_body
      type: laser_filters/LaserScanBoxFilter
      params:
        box_frame: base_link
        min_x: 0.055
        max_x: 0.17
        min_y: -0.2
        max_y: -0.1
        min_z: -0.05
        max_z: 0.4
        invert: false
    # 2026-11-02: live rear-left returns; user confirmed chassis/bracket.
    # Small 3.5 cm x 6.5 cm extension; stop-zone dimensions stay unchanged.
    filter5:
      name: rear_left_inner_bracket
      type: laser_filters/LaserScanBoxFilter
      params:
        box_frame: base_link
        min_x: -0.17
        max_x: -0.135
        min_y: 0.04
        max_y: 0.105
        min_z: -0.05
        max_z: 0.4
        invert: false
    # Full 25 cm x 32 cm chassis, centred on base_link.
    # Existing measured bracket masks remain in filters 1-5.
    filter6:
      name: full_chassis_body
      type: laser_filters/LaserScanBoxFilter
      params:
        box_frame: base_link
        min_x: -0.125
        max_x: 0.125
        min_y: -0.16
        max_y: 0.16
        min_z: -0.05
        max_z: 0.4
        invert: false
